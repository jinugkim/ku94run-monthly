name: Inspect Garmin Challenge Goal Metadata

on:
  workflow_dispatch:
    inputs:
      month:
        description: 2026 challenge month to inspect
        required: true
        type: choice
        options: ['2', '3', '4', '5', '6', '7', '8', '9']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect goal-related metadata
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_CHALLENGE_2026_02_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_02_UUID }}
          GARMIN_CHALLENGE_2026_03_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_03_UUID }}
          GARMIN_CHALLENGE_2026_04_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_04_UUID }}
          GARMIN_CHALLENGE_2026_05_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_05_UUID }}
          GARMIN_CHALLENGE_2026_06_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_06_UUID }}
          GARMIN_CHALLENGE_2026_07_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_07_UUID }}
          GARMIN_CHALLENGE_2026_08_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_08_UUID }}
          GARMIN_CHALLENGE_2026_09_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_09_UUID }}
          INSPECT_MONTH: ${{ inputs.month }}
          TOKEN_STORE_PATH: ~/.garminconnect
        run: |
          case "$INSPECT_MONTH" in
            2) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_02_UUID" ;;
            3) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_03_UUID" ;;
            4) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_04_UUID" ;;
            5) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_05_UUID" ;;
            6) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_06_UUID" ;;
            7) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_07_UUID" ;;
            8) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_08_UUID" ;;
            9) export GARMIN_CHALLENGE_INSPECT_UUID="$GARMIN_CHALLENGE_2026_09_UUID" ;;
            *) echo "Unsupported month" >&2; exit 1 ;;
          esac
          python inspect_challenge_metadata.py
