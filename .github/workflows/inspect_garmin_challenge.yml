name: Inspect Garmin Challenge Goal Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect goal-related metadata
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_CHALLENGE_INSPECT_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_01_UUID }}
          TOKEN_STORE_PATH: ~/.garminconnect
        run: python inspect_challenge_metadata.py
