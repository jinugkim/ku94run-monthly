name: Run-teller Daily Challenge Strategy Cron

on:
  schedule:
    - cron: '0 22 * * *' # KST 07:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runteller-daily-pages
  cancel-in-progress: false

jobs:
  run-runteller:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Restore Garmin session tokens
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-${{ runner.os }}-
      - name: Check Kakao delivery configuration
        id: kakao-config
        env:
          KAKAO_REFRESH_TOKENS_JSON: ${{ secrets.KAKAO_REFRESH_TOKENS_JSON }}
        run: |
          if [ -n "$KAKAO_REFRESH_TOKENS_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token for secret rotation
        if: steps.kakao-config.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: run-teller
          permission-secrets: write
      - name: Execute Run-teller Engine
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_CHALLENGE_UUID: ${{ secrets.GARMIN_CHALLENGE_UUID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKENS_JSON: ${{ secrets.KAKAO_REFRESH_TOKENS_JSON }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
      - name: Save standings history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          if git diff --cached --quiet; then
            echo "No standings history changes to commit"
          else
            git commit -m "Update daily standings history"
            git push
          fi
      - name: Upload report page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-runteller
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
