name: Run-teller Daily Challenge Strategy Cron

on:
  schedule:
    - cron: '10 17 * * *' # KST 02:10
  workflow_dispatch:
    inputs:
      backfill_month:
        description: 과거 월 최종 결과 수집 (all 또는 1~9, 기본 실행은 none)
        required: true
        type: choice
        default: none
        options: ['none', 'all', '1', '2', '3', '4', '5', '6', '7', '8', '9']

permissions:
  contents: read

concurrency:
  group: runteller-daily-pages
  cancel-in-progress: false

jobs:
  run-runteller:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Restore Garmin session tokens
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-${{ runner.os }}-
      - name: Execute Run-teller Engine
        if: github.event_name != 'workflow_dispatch' || inputs.backfill_month == 'none'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_CHALLENGE_2026_01_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_01_UUID }}
          GARMIN_CHALLENGE_2026_02_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_02_UUID }}
          GARMIN_CHALLENGE_2026_03_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_03_UUID }}
          GARMIN_CHALLENGE_2026_04_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_04_UUID }}
          GARMIN_CHALLENGE_2026_05_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_05_UUID }}
          GARMIN_CHALLENGE_2026_06_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_06_UUID }}
          GARMIN_CHALLENGE_2026_07_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_07_UUID }}
          GARMIN_CHALLENGE_2026_08_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_08_UUID }}
          GARMIN_CHALLENGE_2026_09_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_09_UUID }}
          GARMIN_CHALLENGE_2026_10_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_10_UUID }}
          GARMIN_CHALLENGE_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_10_UUID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          KAKAO_SEND_ENABLED: 'false'
          PUBLIC_BOARD_ENABLED: ${{ vars.PUBLIC_BOARD_ENABLED }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
      - name: Backfill archived Garmin challenge results
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_month != 'none'
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_CHALLENGE_2026_01_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_01_UUID }}
          GARMIN_CHALLENGE_2026_02_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_02_UUID }}
          GARMIN_CHALLENGE_2026_03_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_03_UUID }}
          GARMIN_CHALLENGE_2026_04_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_04_UUID }}
          GARMIN_CHALLENGE_2026_05_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_05_UUID }}
          GARMIN_CHALLENGE_2026_06_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_06_UUID }}
          GARMIN_CHALLENGE_2026_07_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_07_UUID }}
          GARMIN_CHALLENGE_2026_08_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_08_UUID }}
          GARMIN_CHALLENGE_2026_09_UUID: ${{ secrets.GARMIN_CHALLENGE_2026_09_UUID }}
          BACKFILL_MONTHS: ${{ inputs.backfill_month }}
          TOKEN_STORE_PATH: ~/.garminconnect
        run: python backfill_challenges.py
      - name: Save standings history
        if: (github.event_name != 'workflow_dispatch' || inputs.backfill_month == 'none') && vars.PUBLIC_BOARD_ENABLED != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          if git diff --cached --quiet; then
            echo "No standings history changes to commit"
          else
            git commit -m "Update daily standings history"
            git push
          fi
      - name: Save archived challenge results
        if: github.event_name == 'workflow_dispatch' && inputs.backfill_month != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archives/2026
          if git diff --cached --quiet; then
            echo "No archived challenge changes to commit"
          else
            git commit -m "Backfill archived challenge results"
            git push
          fi
      - name: Upload report page
        if: github.event_name != 'workflow_dispatch' || inputs.backfill_month == 'none'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-runteller
    if: github.event_name != 'workflow_dispatch' || inputs.backfill_month == 'none'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
